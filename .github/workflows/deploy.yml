name: Publicar NexWash

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Preparar versão legado TOP LINE
        shell: bash
        run: |
          mkdir -p site
          cp index.html styles.css .nojekyll site/
          cp -R js assets site/
          cp public/CNAME site/CNAME
          cat > site/config.js <<EOF
          window.LAVA_CONFIG = {
            SUPABASE_URL: "${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}",
            SUPABASE_ANON_KEY: "${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}",
          };
          EOF
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Preparar artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
