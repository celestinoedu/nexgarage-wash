name: Publicar NexWash

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      # A raiz do domínio continua servindo a versão legado, que é a atual
      # para quem ainda não optou pela nova.
      - name: Preparar versão legado TOP LINE
        shell: bash
        run: |
          mkdir -p site
          cp index.html styles.css .nojekyll site/
          cp -R js assets site/
          cp public/CNAME site/CNAME
          cat > site/config.js <<EOF
          window.LAVA_CONFIG = {
            SUPABASE_URL: "${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}",
            SUPABASE_ANON_KEY: "${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}",
          };
          EOF

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      # A versão nova é publicada em /app, convivendo com o legado na mesma
      # origem — é o que permite o alternador e a preferência compartilhada.
      - name: Construir versão nova
        env:
          NEXT_PUBLIC_BASE_PATH: /app
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Publicar versão nova em /app
        shell: bash
        run: |
          mkdir -p site/app
          cp -R out/. site/app/
          # O CNAME e o .nojekyll valem para o site inteiro, na raiz.
          rm -f site/app/CNAME

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Preparar artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
